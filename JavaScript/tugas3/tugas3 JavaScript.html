<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid black; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <h2>Manajemen Produk</h2>
    <label>Nama: <input type="text" id="nama"></label>
    <label>Harga: <input type="number" id="harga"></label>
    <label>Stok: <input type="number" id="stok"></label>
    <button onclick="tambahProduk()">Tambah Produk</button>

    <h3>Daftar Produk</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="produkList"></tbody>
    </table>

    <script>
        let produkToko = [
            { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
            { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
            { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
        ];

        function tampilkanProduk() {
            let daftarProduk = document.getElementById("produkList");
            daftarProduk.innerHTML = "";
            produkToko.forEach(produk => {
                let row = `<tr>
                    <td>${produk.id}</td>
                    <td>${produk.nama}</td>
                    <td>Rp${produk.harga}</td>
                    <td>${produk.stok}</td>
                    <td><button onclick="hapusProduk(${produk.id})">Hapus</button></td>
                </tr>`;
                daftarProduk.innerHTML += row;
            });
        }

        function tambahProduk() {
            let nama = document.getElementById("nama").value;
            let harga = parseInt(document.getElementById("harga").value);
            let stok = parseInt(document.getElementById("stok").value);
            
            if (nama && harga > 0 && stok > 0) {
                let idBaru = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
                produkToko.push({ id: idBaru, nama, harga, stok });
                tampilkanProduk();
                document.getElementById("nama").value = "";
                document.getElementById("harga").value = "";
                document.getElementById("stok").value = "";
            } else {
                alert("Harap isi semua bidang dengan benar!");
            }
        }

        function hapusProduk(id) {
            produkToko = produkToko.filter(produk => produk.id !== id);
            tampilkanProduk();
        }

        tampilkanProduk();
    </script>
</body>
</html>
