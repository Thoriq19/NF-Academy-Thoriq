<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Transportasi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h2, h3 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
        }
        input {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: white;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h2>Sistem Manajemen Transportasi</h2>
    <label for="nama">Nama:</label>
    <input type="text" id="nama" placeholder="Masukkan Nama">
    <label for="nomorTelepon">Nomor Telepon:</label>
    <input type="text" id="nomorTelepon" placeholder="Masukkan Nomor Telepon">
    <label for="kendaraan">Kendaraan:</label>
    <input type="text" id="kendaraan" placeholder="Masukkan Jenis Kendaraan">
    <button onclick="tambahPelanggan()">Sewa Kendaraan</button>
    <h3>Daftar Pelanggan</h3>
    <ul id="daftarPelanggan"></ul>
    
    <script>
        class Pelanggan {
            constructor(nama, nomorTelepon, kendaraanDisewa) {
                this.nama = nama;
                this.nomorTelepon = nomorTelepon;
                this.kendaraanDisewa = kendaraanDisewa;
            }

            getInfo() {
                return `Nama: ${this.nama}, No. Telepon: ${this.nomorTelepon}, Kendaraan: ${this.kendaraanDisewa}`;
            }
        }

        class SistemTransportasi {
            constructor() {
                this.daftarPelanggan = [];
            }

            sewaKendaraan(nama, nomorTelepon, kendaraanDisewa) {
                const pelangganBaru = new Pelanggan(nama, nomorTelepon, kendaraanDisewa);
                this.daftarPelanggan.push(pelangganBaru);
                this.perbaruiTampilan();
            }

            perbaruiTampilan() {
                const daftarPelangganElem = document.getElementById("daftarPelanggan");
                daftarPelangganElem.innerHTML = "";
                this.daftarPelanggan.forEach((pelanggan, index) => {
                    const li = document.createElement("li");
                    li.textContent = `${index + 1}. ${pelanggan.getInfo()}`;
                    daftarPelangganElem.appendChild(li);
                });
            }
        }

        const sistem = new SistemTransportasi();

        function tambahPelanggan() {
            const nama = document.getElementById("nama").value;
            const nomorTelepon = document.getElementById("nomorTelepon").value;
            const kendaraan = document.getElementById("kendaraan").value;
            
            if (nama && nomorTelepon && kendaraan) {
                sistem.sewaKendaraan(nama, nomorTelepon, kendaraan);
                document.getElementById("nama").value = "";
                document.getElementById("nomorTelepon").value = "";
                document.getElementById("kendaraan").value = "";
            } else {
                alert("Harap isi semua kolom!");
            }
        }
    </script>
</body>
</html>
