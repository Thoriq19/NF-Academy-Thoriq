<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pegawai</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #7682ad;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Nama Pegawai</th>
                <th>Umur</th>
                <th>Jabatan</th>
                <th>Status</th>
                <th>Gaji Pokok</th>
                <th>Tunjangan Jabatan</th>
                <th>BPJS</th>
                <th>Tunjangan Keluarga</th>
                <th>Total Gaji</th>
            </tr>
        </thead>
        <tbody>
            <script>
                let pegawai = "Dodi Prayodi";
                let umur = 25;
                let jabatan = "Manajer";
                let status = "Menikah";
                
                let gajiPokok = (jabatan === "Manajer") ? 15000000 :
                                (jabatan === "Asisten Manajer") ? 10000000 :
                                (jabatan === "Staff") ? 5000000 : 0;
                
                let tunjanganJabatan = 0.15 * gajiPokok;
                let bpjs = 0.10 * gajiPokok;
                let tunjanganKeluarga = (status === "Menikah") ? 0.20 * gajiPokok : 0;
                let totalGaji = gajiPokok + tunjanganJabatan + bpjs + tunjanganKeluarga;
                
                document.write(`<tr>
                    <td>${pegawai}</td>
                    <td>${umur}</td>
                    <td>${jabatan}</td>
                    <td>${status}</td>
                    <td>Rp ${gajiPokok.toLocaleString()}</td>
                    <td>Rp ${tunjanganJabatan.toLocaleString()}</td>
                    <td>Rp ${bpjs.toLocaleString()}</td>
                    <td>Rp ${tunjanganKeluarga.toLocaleString()}</td>
                    <td>Rp ${totalGaji.toLocaleString()}</td>
                </tr>`);
            </script>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="8"><strong>Total Gaji</strong></td>
                <td><strong>Rp <script>document.write(totalGaji.toLocaleString());</script></strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
